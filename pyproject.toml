
[project]
name = "dumgpt2-124m"
version = "0.1.0"
description = "A GPT-2 implementation and training project"
readme = "README.md"
authors = [
    { name = "Shubham Kumar Sahu", email = "shubhamisok@gmail.com" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "datasets>=5.2.0",
    "numpy>=2.5.4",
    "tiktoken>=0.14.0",
    "torch==2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
    "triton-windows>=3.9.0.post30",
    "matplotlib>=3.10",
]

# PyTorch CUDA 13.0 wheels for Windows
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
package = false
